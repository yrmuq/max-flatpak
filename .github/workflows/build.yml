name: Build and Publish MAX Flatpak

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder curl libarchive-tools
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: Fetch latest MAX version
        id: fetch_version
        run: |
          set -euo pipefail
          curl -fsSL "https://download.max.ru/linux/deb/dists/stable/main/binary-amd64/Packages" -o Packages
          python3 << 'PY'
          import os, re
          from pathlib import Path
          text = Path("Packages").read_text()
          best = None
          for block in text.split("\n\n"):
              if not re.search(r"(?m)^Package: max$", block):
                  continue
              filename = re.search(r"(?m)^Filename: (\S+)", block).group(1)
              name = filename.rsplit("/", 1)[-1]
              match = re.search(r"^MAX-(.+)\.deb$", name)
              if not match:
                  continue
              version = match.group(1)
              key = tuple(int(part) for part in version.split("."))
              if best is None or key > best[0]:
                  best = (key, version, filename, name)
          if best is None:
              raise SystemExit("MAX package not found in Debian repo")
          _, version, filename, name = best
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as handle:
              handle.write(f"version={version}\n")
              handle.write(f"filename={filename}\n")
              handle.write(f"deb_name={name}\n")
          print(f"Found MAX {version} ({name})")
          PY

      - name: Check if version already released
        id: check_release
        run: |
          VERSION="${{ steps.fetch_version.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q "v$VERSION"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version v$VERSION already exists"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Version v$VERSION is new"
          fi

      - name: Download and prepare DEB
        if: github.event_name != 'schedule' || steps.check_release.outputs.exists != 'true'
        id: prepare_deb
        timeout-minutes: 20
        env:
          VERSION: ${{ steps.fetch_version.outputs.version }}
          FILENAME: ${{ steps.fetch_version.outputs.filename }}
        run: |
          set -euo pipefail
          URL="https://download.max.ru/linux/deb/${FILENAME}"
          curl -fL --retry 5 --retry-delay 2 -o MAX.deb "$URL"
          SHA=$(sha256sum MAX.deb | awk '{print $1}')
          SIZE=$(stat -c%s MAX.deb)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

          rm -rf payload stage
          mkdir -p payload
          DATA=$(bsdtar -tf MAX.deb | awk '/^data\.tar/{print; exit}')
          test -n "$DATA"
          bsdtar -Oxf MAX.deb "$DATA" | bsdtar -xf - -C payload
          test -d payload/usr/share/max
          mkdir -p stage
          mv payload/usr/share/max stage/max
          test -x stage/max/bin/max
          cp payload/usr/share/icons/hicolor/512x512/apps/max.png ru.max.Unofficial.png

          export URL SHA SIZE VERSION
          python3 << 'PY'
          import os
          from datetime import date
          from pathlib import Path
          text = Path("ru.max.Unofficial.yaml").read_text()
          text = text.replace("DEB_URL_PLACEHOLDER", os.environ["URL"])
          text = text.replace("DEB_SHA256_PLACEHOLDER", os.environ["SHA"])
          text = text.replace("DEB_SIZE_PLACEHOLDER", os.environ["SIZE"])
          Path("ru.max.Unofficial.build.yaml").write_text(text)
          meta = Path("ru.max.Unofficial.metainfo.xml").read_text()
          meta = meta.replace("VERSION_PLACEHOLDER", os.environ["VERSION"])
          meta = meta.replace("DATE_PLACEHOLDER", date.today().isoformat())
          Path("ru.max.Unofficial.metainfo.xml").write_text(meta)
          PY

          curl -fsSL -o krb5-1.22.patch https://raw.githubusercontent.com/flathub/ru.max.MAX/master/krb5-1.22.patch
          curl -fsSL -o krb5.conf https://raw.githubusercontent.com/flathub/ru.max.MAX/master/krb5.conf
          test -s krb5-1.22.patch
          test -s krb5.conf

      - name: Build extra-data Flatpak for GitHub Pages
        if: github.event_name != 'schedule' || steps.check_release.outputs.exists != 'true'
        run: |
          set -euo pipefail
          flatpak-builder --user --force-clean --repo=public_repo build_dir_public ru.max.Unofficial.build.yaml
          flatpak build-update-repo --generate-static-deltas public_repo
          cat > public_repo/max.flatpakrepo << 'EOF'
          [Flatpak Repo]
          Title=MAX Unofficial Repository
          Url=https://yrmuq.github.io/max-package/
          Homepage=https://github.com/yrmuq/max-package
          Comment=Неофициальный репозиторий Flatpak-пакета мессенджера MAX
          Description=Автоматически обновляемая сборка MAX с полной изоляцией в песочнице
          GPGVerify=false
          EOF
          touch public_repo/.nojekyll

      - name: Build bundle Flatpak for GitHub Releases
        if: github.event_name != 'schedule' || steps.check_release.outputs.exists != 'true'
        run: |
          set -euo pipefail
          flatpak-builder --user --force-clean --repo=bundle_repo build_dir_bundle ru.max.Unofficial.bundle.yaml
          flatpak build-bundle bundle_repo MAX.flatpak ru.max.Unofficial \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            --repo-url=https://yrmuq.github.io/max-package/

      - name: Deploy to GitHub Pages
        if: github.event_name != 'schedule' || steps.check_release.outputs.exists != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public_repo
          force_orphan: true

      - name: Create GitHub Release
        if: github.event_name != 'schedule' || steps.check_release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.fetch_version.outputs.version }}
          name: MAX v${{ steps.fetch_version.outputs.version }}
          body: |
            ## MAX v${{ steps.fetch_version.outputs.version }}

            Автоматическая сборка мессенджера MAX в изолированной песочнице Flatpak.

            **Оригинальный DEB:** `${{ steps.fetch_version.outputs.deb_name }}`

            **SHA256:** `${{ steps.prepare_deb.outputs.sha256 }}`

            ### Установка

            **Способ 1 (рекомендуется, с автообновлением):**
            ```bash
            flatpak remote-add --user --if-not-exists --no-gpg-verify max-repo https://yrmuq.github.io/max-package/
            flatpak install --user max-repo ru.max.Unofficial
            ```

            **Способ 2 (одиночный файл):**
            ```bash
            flatpak install --user MAX.flatpak
            ```

            ### Запуск
            ```bash
            flatpak run ru.max.Unofficial
            ```
          files: |
            MAX.flatpak
          token: ${{ secrets.GITHUB_TOKEN }}
