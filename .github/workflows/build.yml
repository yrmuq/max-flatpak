name: Build and Publish MAX Flatpak

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder curl cpio rpm2cpio aria2
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08

      - name: Fetch latest MAX version
        id: fetch_version
        run: |
          set -euo pipefail
          curl -fsSL "https://download.max.ru/linux/rpm/el/9/x86_64/repodata/repomd.xml" -o repomd.xml
          PRIMARY_PATH=$(grep -oP 'href="\Krepodata/[^"]+-primary\.xml\.gz' repomd.xml | head -n 1)
          curl -fsSL "https://download.max.ru/linux/rpm/el/9/x86_64/$PRIMARY_PATH" -o primary.xml.gz
          gzip -df primary.xml.gz
          RPM_FILE=$(grep -o 'MAX-[0-9.]*\.rpm' primary.xml | sort -V | tail -n 1)
          VERSION=$(echo "$RPM_FILE" | sed -E 's/^MAX-([0-9.]+)\.rpm$/\1/')
          echo "rpm_file=$RPM_FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Found MAX version: $VERSION ($RPM_FILE)"

      - name: Check if version already released
        id: check_release
        run: |
          VERSION="${{ steps.fetch_version.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q "v$VERSION"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version v$VERSION already exists"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Version v$VERSION is new"
          fi

      - name: Download RPM
        if: github.event_name != 'schedule' || steps.check_release.outputs.exists != 'true'
        id: prepare_rpm
        timeout-minutes: 15
        run: |
          set -euo pipefail
          RPM_FILE="${{ steps.fetch_version.outputs.rpm_file }}"
          aria2c -x 16 -s 16 -k 1M --connect-timeout=15 --timeout=60 \
            "https://download.max.ru/linux/rpm/el/9/x86_64/$RPM_FILE" -o max.rpm
          test -s max.rpm
          echo "sha256=$(sha256sum max.rpm | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s max.rpm)" >> "$GITHUB_OUTPUT"
          echo "url=https://download.max.ru/linux/rpm/el/9/x86_64/$RPM_FILE" >> "$GITHUB_OUTPUT"

      - name: Unpack RPM into the bundle tree
        if: github.event_name != 'schedule' || steps.check_release.outputs.exists != 'true'
        run: |
          set -euo pipefail
          rm -rf payload stage
          mkdir payload
          (cd payload && rpm2cpio ../max.rpm | cpio -idm)
          test -x payload/usr/share/max/bin/max
          mkdir -p stage
          mv payload/usr/share/max stage/max
          ln -sfn ../bin/max-service/lib64/libpulsecommon-14.0.so stage/max/lib64/libpulsecommon-14.0.so

          ICON=$(find payload/usr/share/icons -type f -name '*.png' -printf '%s %p\n' | sort -nr | head -n 1 | cut -d' ' -f2- || true)
          if [ -z "$ICON" ]; then
            ICON=payload/usr/share/pixmaps/max.png
          fi
          test -f "$ICON"
          cp "$ICON" ru.max.Unofficial.png

          VERSION="${{ steps.fetch_version.outputs.version }}"
          sed -i "s|VERSION_PLACEHOLDER|$VERSION|g" ru.max.Unofficial.metainfo.xml
          sed -i "s|DATE_PLACEHOLDER|$(date +%Y-%m-%d)|g" ru.max.Unofficial.metainfo.xml
          base64 -d krb5-1.22.patch.b64 > krb5-1.22.patch
          test -s krb5-1.22.patch

      - name: Build full Flatpak bundle
        if: github.event_name != 'schedule' || steps.check_release.outputs.exists != 'true'
        run: |
          set -euo pipefail
          flatpak-builder --user --force-clean --repo=bundle_repo build_dir ru.max.Unofficial.bundle.yaml
          flatpak build-bundle bundle_repo MAX.flatpak ru.max.Unofficial \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          test -s MAX.flatpak

      - name: Create GitHub Release
        if: github.event_name != 'schedule' || steps.check_release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.fetch_version.outputs.version }}
          name: MAX v${{ steps.fetch_version.outputs.version }}
          body: |
            ## MAX v${{ steps.fetch_version.outputs.version }}

            Полный Flatpak: клиент уже внутри, при установке ничего больше не скачивается.

            **Оригинальный RPM:** `${{ steps.fetch_version.outputs.rpm_file }}`

            **SHA256:** `${{ steps.prepare_rpm.outputs.sha256 }}`

            ### Установка
            ```bash
            flatpak uninstall --user ru.max.Unofficial || true
            flatpak install --user MAX.flatpak
            flatpak run ru.max.Unofficial
            ```
          files: |
            MAX.flatpak
          token: ${{ secrets.GITHUB_TOKEN }}
