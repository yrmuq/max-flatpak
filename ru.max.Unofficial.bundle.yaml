app-id: ru.max.Unofficial
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: run_max.sh
separate-locales: false

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --device=all
  - --filesystem=xdg-run/pipewire-0
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.freedesktop.secrets
  - --env=GTK_USE_PORTAL=1

cleanup:
  - /include
  - /lib/cmake
  - /lib/*/cmake
  - /lib/pkgconfig
  - /mkspecs
  - /share/aclocal
  - /share/doc
  - /share/et
  - /share/examples
  - /share/man
  - "*.la"
  - "*.a"

modules:
  - max-deps.yaml
  - name: max
    buildsystem: simple
    build-commands:
      - install -Dm755 run_max.sh /app/bin/run_max.sh
      - install -Dm644 ru.max.Unofficial.desktop /app/share/applications/ru.max.Unofficial.desktop
      - install -Dm644 ru.max.Unofficial.metainfo.xml /app/share/metainfo/ru.max.Unofficial.metainfo.xml
      - install -Dm644 ru.max.Unofficial.png /app/share/icons/hicolor/512x512/apps/ru.max.Unofficial.png
      - install -Dm644 krb5.conf /app/etc/krb5.conf
      - gcc -shared -fPIC -O2 -o /app/lib/libnetlink-stub.so netlink_stub.c -ldl
      - mkdir -p /app/opt
      - cp -a max-payload /app/opt/max
      - test -x /app/opt/max/bin/max
      - ln -sfn ../bin/max-service/lib64/libpulsecommon-14.0.so /app/opt/max/lib64/libpulsecommon-14.0.so
    sources:
      - type: file
        path: run_max.sh
      - type: file
        path: netlink_stub.c
      - type: file
        path: ru.max.Unofficial.desktop
      - type: file
        path: ru.max.Unofficial.metainfo.xml
      - type: file
        path: ru.max.Unofficial.png
      - type: file
        path: krb5.conf
      - type: dir
        path: stage/max
        dest: max-payload
